<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ 티니핑 도감 ✨</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="particles"></div>
    
    <header>
        <h1 class="title">✨ 티니핑 도감 ✨</h1>
        <div class="search-container">
            <span class="search-icon">🔍</span>
            <input type="text" id="searchInput" placeholder="티니핑 이름 검색 (한글/영문)">
        </div>
    </header>

    <main>
        <div class="filters">
            <div class="season-tabs" id="seasonTabs">
                <!-- Generated dynamically -->
            </div>
            <div class="grade-filters" id="gradeFilters">
                <button class="grade-btn active" data-grade="로열" style="--grade-color: #FFD700">👑 로열</button>
                <button class="grade-btn active" data-grade="일반" style="--grade-color: #3498DB">⭐ 일반</button>
                <button class="grade-btn active" data-grade="레전드" style="--grade-color: #FF69B4">🌈 레전드</button>
                <button class="grade-btn active" data-grade="빌런" style="--grade-color: #8E44AD">😈 빌런</button>
            </div>
        </div>

        <div class="grid-container" id="tinipingGrid">
            <!-- Cards go here -->
        </div>
    </main>

    <footer>
        <p id="statsCounter">총 0마리의 티니핑</p>
    </footer>

    <!-- Detail Modal -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <div class="modal-header">
                <div class="modal-avatar" id="modalAvatar"></div>
                <h2 id="modalNameKo">이름</h2>
                <p id="modalNameEn">Name</p>
            </div>
            <div class="modal-body">
                <div class="badge-container">
                    <span id="modalGrade" class="badge"></span>
                    <span id="modalEmotion" class="badge"></span>
                    <span id="modalSeason" class="badge"></span>
                </div>
                <p id="modalDescription" class="description"></p>
                <div class="gender-indicator" id="modalGender"></div>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
